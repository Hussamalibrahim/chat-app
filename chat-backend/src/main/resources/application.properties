spring.application.name=chat-backend
server.port=8080

# PostgreSQL - R2DBC
spring.r2dbc.url=${R2DBC_URL:r2dbc:postgresql://localhost:5432/chat_db}
spring.r2dbc.username=${R2DBC_USERNAME:postgres}
spring.r2dbc.password=${R2DBC_PASSWORD:2005}

# JWT
jwt.secret.key=${JWT_SECRET_KEY:0a2d0a5b7580d1ea38a248822e082bf03e472df48b9981a127aacfe0373f93a5}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.auto-startup=${KAFKA_LISTENER_AUTO_STARTUP:false}

# Actuator & Prometheus Metrics
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

# Storage
app.storage.local-dir=${APP_STORAGE_DIR:./uploads/attachments}
